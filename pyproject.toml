[project]
name = "signal-engine"
version = "0.1.0"
description = "Cross-sectional, point-in-time, cost-aware signal engine on a free-data spine (EDGAR XBRL + Stooq + IJR + FINRA + EIA/FRED). Energy Atlas folded in as a feature generator."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "polars>=1.6.0",
  "pyarrow>=17.0.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.32.0",
  "pyyaml>=6.0.2",
  "python-dateutil>=2.9.0",
  "scipy>=1.13.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.11.0",
  "types-requests>=2.32.0",
  "types-PyYAML>=6.0.12",
  "pandas-stubs>=2.2.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_engine*"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["signal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "live: tests that hit live external endpoints (skipped by default in CI)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
