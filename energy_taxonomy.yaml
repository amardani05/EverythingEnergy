# ============================================================

iocs_integrated:
  display_name: "Integrated Oil & Gas (IOCs)"
  description: "Vertically integrated majors. Anchor nodes - flows in and out across the whole graph."
  layer: port
  representative_ticker: XOM
  gics: "10102050"
  commodity_exposure: [CL1, BRENT, NG1, CRACK_321]
  key_drivers: [CL1, BRENT, CRACK_321, BUYBACK_PACE, CAPEX_GUIDE]
  feeds_into: [midstream_pipelines, downstream_refiners, petrochem]
  served_by_revenue_from: [ofs_onshore, ofs_offshore, ofs_equipment, upstream_offshore_drillers]
  constituents:
    - {ticker: XOM, name: "ExxonMobil", index: 500, mc: large, niche: "diversified IOC", confidence: high}
    - {ticker: CVX, name: "Chevron", index: 500, mc: large, niche: "diversified IOC", confidence: high}
  notes: |
    - Treat as graph hub. v0.3 confirmed 0.85 intra-cohesion and 0.83 cross-correlation
      with upstream_oil_eandp - these names anchor the entire upstream factor.

