# Energy Sector Taxonomy - IMA Dashboard
# Version 0.4 - Reconciled against basket correlation results + full utilities universe
# ====================================================================================
#
# CHANGELOG vs v0.3
# ------------------
# Taxonomy fixes from misclassification analysis (LOO basket check, 5y daily returns):
#   - lng_export SPLIT into lng_terminals (LNG, CQP, VG, NEXT, EE) and FLNG/GLNG moved
#     to tanker_shipping. Original lng_export had 0.37 cohesion because it conflated
#     terminal economics with shipping economics.
#   - compression_services FOLDED into midstream_gpt. AROC, USAC, KGS all show top
#     correlation with midstream_gpt; the carve-out didn't earn its keep.
#   - DTM moved from midstream_pipelines to midstream_gpt (delta +0.12, strong signal).
#   - FLOC moved from minerals_royalty to ofs_onshore (originally flagged 'verify' - #     it's a production optimization OFS name, not a royalty company).
#   - minerals_royalty KEPT as separate node despite weak basket cohesion. Justification:
#     business model and valuation framework are genuinely different (yield + growth vs
#     EV/EBITDA). For graph navigation it's a meaningful distinction even if returns
#     cluster with E&Ps. Sub-tagged differently to acknowledge return behavior.
#   - SOC (Sable Offshore) reclassified to upstream_offshore_drillers - California
#     offshore restart, not a typical onshore E&P. (-0.31 min_pair in oil E&P explains
#     the negative correlation.)
#
# Utilities universe added from CapIQ pull (64 names → narrowed to ~25 energy-relevant):
#   - Water utilities (AWK, WTRG, AWR, CWT, HTO) EXCLUDED - not energy-relevant
#   - Brookfield names (BIP, BIPC, BEPC) EXCLUDED - diversified infrastructure
#   - power_ipps_merchant: VST, NRG, TLN, CEG (+ added SRE Sempra for LNG exposure)
#   - power_utilities_regulated_gas: SO, DUK, D, AEP, SRE, ETR, XEL, EXC, PEG, WEC,
#     PCG, ATO, AEE, DTE, CNP, FE, EIX, ES, CMS, NI, EVRG, PNW, AES, OGE
#   - power_utilities_regulated_ldc: NJR, SR, OGS, SWX, NFG, UGI (gas local distribution)
#   - power_renewables: NEE, CWEN, ORA, XIFR
#   - nuclear_smr_developers: OKLO (new sub-node - small modular reactor developer,
#     not a fuel cycle name like UEC/LEU)
#
# Map layer/tier metadata added per node:
#   - layer: ocean | port | onshore_subsurface | onshore_surface | end_user
#   - representative_ticker: largest mcap name in node, used for map hover preview
#
# ====================================================================================
# CONVENTIONS
# - tickers: cash equity primary listing
# - index: 500 | 400 | 600 | ext (functionally energy but outside S&P universe)
# - mc_bucket: large (>$10B), mid ($2-10B), small (<$2B)
# - tax_form: 1099 (C-corp default) | K-1 (MLP) | trust (royalty trust)
# - layer: where the node sits on the geographic map
#   * ocean: offshore drillers, OFS-offshore, tanker shipping (out at sea)
#   * port: LNG terminals, refineries, pipelines, GPT, petrochem (Gulf Coast complex)
#   * onshore_subsurface: oil/gas E&P, minerals/royalty (in the basins)
#   * onshore_surface: OFS-onshore, OFS-equipment, biofuels, coal mines (above ground)
#   * end_user: IPPs, utilities, renewables, retail, uranium fuel cycle (consumers)
# ====================================================================================

meta:
  version: 0.4
  last_updated: 2026-05-06
  source_screen: "CapIQ - Industry: Energy + Utilities (Primary), Primary Listing: US, MCap > $500M"
  flow_convention: commodity
  universe_count: ~190
  map_layers: [ocean, port, onshore_subsurface, onshore_surface, end_user]

