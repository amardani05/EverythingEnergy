  description: "Gasoline/diesel demand sink."
  layer: end_user

external_steelmakers:
  display_name: "[External] Steelmakers (Met Coal Demand)"
  description: "Global steel mills - met coal end demand. Cyclical with China/India construction."
  layer: end_user

external_industrial_demand:
  display_name: "[External] Petrochem End Demand"
  description: "Plastics, packaging, durable goods. Cyclical with global IP."
  layer: end_user

external_global_demand:
  display_name: "[External] Global Crude/Product Demand"
  description: "Tanker ton-mile demand sink."
  layer: ocean

external_grid_demand:
  display_name: "[External] Grid Power Demand"
  description: "End-use electricity demand."
  layer: end_user

# ============================================================
# DRIVER METRICS
# ============================================================
# Source priority: FRED (free) → yfinance (free) → FactSet (subscription)
# Update frequency notes per series

drivers:
  # Crude / oil
  CL1:                 {name: "WTI Crude Front Month",       source: "FRED: DCOILWTICO (daily)", freq: daily}
  BRENT:               {name: "Brent Crude Front Month",     source: "FRED: DCOILBRENTEU (daily)", freq: daily}
  WTI_BRENT_SPREAD:    {name: "WTI-Brent Spread",            source: "computed", freq: daily}
  WTI_MIDLAND_DIFF:    {name: "WTI Midland Differential",    source: "FactSet/Argus", freq: daily}

  # Gas / NGLs
  NG1:                 {name: "Henry Hub Natgas Front",      source: "FRED: DHHNGSP (daily)", freq: daily}
  JKM:                 {name: "JKM LNG Asia",                source: "FactSet (S&P Global)", freq: daily}
  TTF:                 {name: "Dutch TTF Gas",               source: "FactSet/ICE", freq: daily}
  JKM_HH_SPREAD:       {name: "JKM minus HH",                source: "computed", freq: daily}
  TTF_HH_SPREAD:       {name: "TTF minus HH",                source: "computed", freq: daily}
  NGL_FRAC_SPREAD:     {name: "NGL Frac Spread",             source: "FactSet/RBN", freq: daily}

  # Refined products
  RB1:                 {name: "RBOB Gasoline Front",         source: "yfinance: RB=F (daily)", freq: daily}
  HO1:                 {name: "Heating Oil Front",           source: "yfinance: HO=F (daily)", freq: daily}
  CRACK_321:           {name: "3-2-1 Crack Spread",          source: "computed: 2*RB+HO - 3*CL", freq: daily}
  RIN_D6:              {name: "Renewable ID D6 (Ethanol)",   source: "EPA OBWG (weekly)", freq: weekly}
  RIN_D4:              {name: "Renewable ID D4 (Biodiesel)", source: "EPA OBWG (weekly)", freq: weekly}

  # Activity / inventory
  BKR_OIL_RIG_COUNT:   {name: "BKR US Oil Rigs",             source: "Baker Hughes (Friday)", freq: weekly}
  BKR_GAS_RIG_COUNT:   {name: "BKR US Gas Rigs",             source: "Baker Hughes (Friday)", freq: weekly}
  EIA_CRUDE_INVENTORY: {name: "EIA Crude Stocks",            source: "FRED: WCESTUS1 (Wed)", freq: weekly}
  EIA_NG_STORAGE:      {name: "EIA NG Storage",              source: "FRED: NGSTUS (Thu)", freq: weekly}
  EIA_GASOLINE_STOCKS: {name: "EIA Gasoline Stocks",         source: "FRED: WGRSTUS1 (Wed)", freq: weekly}
  EIA_DISTILLATE_STOCKS: {name: "EIA Distillate Stocks",     source: "FRED: WDISTUS1 (Wed)", freq: weekly}
  REFINERY_UTILIZATION: {name: "Refinery Utilization",        source: "FRED: WPULEUS3 (weekly)", freq: weekly}

  # Power
  PJM_RTO_POWER:       {name: "PJM RTO On-Peak",             source: "FactSet/EIA-930", freq: daily}
  ERCOT_NORTH_POWER:   {name: "ERCOT North Hub",             source: "FactSet/EIA-930", freq: daily}

  # Coal
  API2_THERMAL:        {name: "API2 Thermal Coal (Europe)",  source: "FactSet/Argus", freq: daily}
  NEWCASTLE_THERMAL:   {name: "Newcastle Thermal Coal",      source: "FactSet/Argus", freq: daily}
  MET_COAL_HCC:        {name: "Australian HCC Met Coal",     source: "FactSet/Platts", freq: daily}

  # Nuclear
  U3O8_SPOT:           {name: "Uranium Spot U3O8",           source: "UxC/TradeTech (weekly)", freq: weekly}
  U3O8_TERM:           {name: "Uranium Term U3O8",           source: "UxC/TradeTech (weekly)", freq: weekly}
  SWU_PRICES:          {name: "Enrichment SWU",              source: "UxC", freq: weekly}

  # Shipping
  BDTI:                {name: "Baltic Dirty Tanker Index",   source: "Baltic Exchange", freq: daily}
  BCTI:                {name: "Baltic Clean Tanker Index",   source: "Baltic Exchange", freq: daily}
  WORLDSCALE_RATES:    {name: "Worldscale TCE Rates",        source: "Clarksons/Baltic", freq: daily}
  VLCC_RATES:          {name: "VLCC Day Rates",              source: "Clarksons", freq: daily}

  # Macro
  CORN_C1:             {name: "CME Corn Front Month",        source: "yfinance: ZC=F (daily)", freq: daily}
  HEATING_DEGREE_DAYS: {name: "US HDD",                      source: "NOAA CPC (weekly)", freq: weekly}
  ETHANOL_CRUSH:       {name: "Ethanol Crush Margin",        source: "computed", freq: daily}
